<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Diskusi UT - Multi AI Support</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <style>
        /* Gaya CSS tetap sama seperti versi Anda sebelumnya untuk konsistensi */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; padding: 20px; color: #2c3e50; }
        .container { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #003366; text-align: center; border-bottom: 3px solid #ffcc00; padding-bottom: 10px; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #555; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccd6dd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .ai-section { background: #f8faff; padding: 20px; border-radius: 10px; border: 1px solid #0056b3; margin-bottom: 20px; }
        .prompt-preview-container { margin-top: 15px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .prompt-tabs { display: flex; background: #f1f3f4; border-radius: 8px 8px 0 0; margin: -15px -15px 15px -15px; padding: 8px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; cursor: pointer; font-weight: 600; font-size: 13px; }
        .tab-btn.active { background: #6f42c1; color: white; border-radius: 6px; }
        .prompt-textarea { height: 140px; font-size: 12px; font-family: 'Consolas', monospace; display: none; width: 100%; margin-top: 10px; }
        .prompt-textarea.active { display: block; }
        .btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: 5px; }
        .btn-copy { background: #17a2b8; color: white; width: 100%; }
        .btn-download { background: #28a745; color: white; width: 100%; height: 50px; }
        .status-file { font-size: 12px; color: #28a745; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔥 Tool Diskusi ga gacormah Abong</h2>
    
    <div class="grid">
        <div><label>👤 Nama:</label><input type="text" id="nama" value="Udin Phetot"></div>
        <div><label>🆔 NIM:</label><input type="text" id="nim" value="058xxxxxx"></div>
        <div><label>🎓 Prodi:</label><input type="text" id="prodi" value="Ilmu Hukum" oninput="updatePrompt()"></div>
        <div><label>📍 UPBJJ:</label><input type="text" id="upbjj" value="Bogor"></div>
    </div>

    <div class="ai-section">
        <label>1. 📝 Topik Diskusi:</label>
        <input type="text" id="topikAI" placeholder="Contoh: Diskusi 1 Hukum Perdata" onkeyup="updatePrompt()">
        
        <label style="margin-top:15px;">2. 🔗 Link Referensi (Opsional):</label>
        <input type="text" id="linkMateri" placeholder="Paste link berita atau artikel di sini..." onkeyup="updatePrompt()">

        <label style="margin-top:15px;">3. 📁 Upload Materi (PDF, DOCX, PPTX, XLSX):</label>
        <input type="file" id="fileMateri" accept=".pdf,.docx,.xlsx,.xls,.pptx,.txt" multiple>
        <div id="fileStatus" class="status-file">✅ Materi Berhasil Diproses!</div>
        <div id="fileNames" style="font-size: 11px; color: #666;"></div>

        <div class="prompt-preview-container">
            <div class="prompt-tabs">
                <button class="tab-btn active" onclick="switchTab('claude')">Claude</button>
                <button class="tab-btn" onclick="switchTab('blackbox')">Blackbox</button>
                <button class="tab-btn" onclick="switchTab('dola')">Dola.ai</button>
            </div>
            
            <textarea id="promptPreviewClaude" class="prompt-textarea active"></textarea>
            <textarea id="promptPreviewBlackbox" class="prompt-textarea"></textarea>
            <textarea id="promptPreviewDola" class="prompt-textarea"></textarea>
            
            <button class="btn btn-copy" onclick="copyCurrentPrompt()">📋 Copy Prompt & Buka AI</button>
        </div>
    </div>

    <label>4. ✏️ Hasil Jawaban AI:</label>
    <textarea id="isiDiskusi" style="height: 200px;" placeholder="Paste jawaban dari AI di sini..."></textarea>
    <button class="btn btn-download" onclick="downloadDiskusi()">💾 DOWNLOAD JAWABAN (.TXT)</button>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
    let combinedContent = "";
    let activeTab = 'claude';

    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.prompt-textarea').forEach(t => t.classList.remove('active'));
        document.getElementById(`promptPreview${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');
    }

    function updatePrompt() {
        const topik = document.getElementById('topikAI').value || "[Topik]";
        const prodi = document.getElementById('prodi').value;
        const link = document.getElementById('linkMateri').value;
        
        let referensi = "";
        if(link) referensi += `\n🔗 LINK SUMBER: ${link}`;
        if(combinedContent) referensi += `\n\n📚 ISI MATERI FILE:\n${combinedContent.substring(0, 4000)}`;

        const basePrompt = `Saya mahasiswa ${prodi} UT. Buatkan jawaban diskusi: "${topik}". ${referensi}\n\nINSTRUKSI: Gunakan bahasa akademis yang natural, sertakan referensi, dan jangan terlihat seperti buatan AI.`;

        document.getElementById('promptPreviewClaude').value = "MODEL: Claude AI\n" + basePrompt;
        document.getElementById('promptPreviewBlackbox').value = "MODEL: Blackbox AI\n" + basePrompt;
        document.getElementById('promptPreviewDola').value = "MODEL: Dola.ai\n" + basePrompt;
    }

    document.getElementById('fileMateri').addEventListener('change', async function(e) {
        const files = e.target.files;
        combinedContent = "";
        let names = [];
        
        for (let file of files) {
            names.push(file.name);
            const ext = file.name.split('.').pop().toLowerCase();
            
            try {
                if (ext === 'pptx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const zip = await JSZip.loadAsync(arrayBuffer);
                    let pptText = "";
                    const slideFiles = Object.keys(zip.files).filter(f => f.startsWith('ppt/slides/slide'));
                    for(let f of slideFiles) {
                        const xml = await zip.file(f).async("string");
                        pptText += xml.replace(/<[^>]+>/g, ' ') + " ";
                    }
                    combinedContent += `\n[FILE PPT: ${file.name}]\n${pptText}\n`;
                } else if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
                    let t = "";
                    for(let i=1; i<=Math.min(pdf.numPages, 10); i++) {
                        const p = await pdf.getPage(i);
                        const c = await p.getTextContent();
                        t += c.items.map(s => s.str).join(" ");
                    }
                    combinedContent += `\n[FILE PDF: ${file.name}]\n${t}\n`;
                } else if (ext === 'docx') {
                    const res = await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
                    combinedContent += `\n[FILE DOCX: ${file.name}]\n${res.value}\n`;
                } else {
                    combinedContent += `\n[FILE: ${file.name}]\n${await file.text()}\n`;
                }
            } catch (err) { console.error("Gagal baca: " + file.name); }
        }
        document.getElementById('fileNames').innerText = "File: " + names.join(", ");
        document.getElementById('fileStatus').style.display = 'block';
        updatePrompt();
    });

    function copyCurrentPrompt() {
        const txt = document.querySelector('.prompt-textarea.active');
        txt.select();
        navigator.clipboard.writeText(txt.value);
        alert("Prompt Disalin! Membuka tab AI...");
        if(activeTab === 'claude') window.open("https://claude.ai/", "_blank");
        if(activeTab === 'blackbox') window.open("https://www.blackbox.ai/", "_blank");
        if(activeTab === 'dola') window.open("https://www.dola.com/chat/", "_blank");
    }

    function downloadDiskusi() {
        const text = `Yth. Tutor,\n\nNama: ${document.getElementById('nama').value}\nNIM: ${document.getElementById('nim').value}\n\n${document.getElementById('isiDiskusi').value}`;
        const blob = new Blob([text], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Diskusi_UT_${document.getElementById('nama').value}.txt`;
        a.click();
    }
</script>
</body>
</html>
